<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BigData26 - interfejsy</title>
<link rel="icon" type="image/svg+xml" href="favicon/favicon.svg">
<link rel="icon" type="image/png" sizes="96x96" href="favicon/favicon-96x96.png">
<link rel="shortcut icon" href="favicon/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f3eee1; --ink: #2b2620; --muted: #8a8172; --card: #faf7f0; --border: #ddd6c4;
    --red: #a8433a; --teal: #5f8f7f; --gold: #c99a3e; --blue: #4472a8;
    --ok: #3f8f5a; --off: #b8ae9c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #211d17; --ink: #f3eee1; --muted: #a89f8d; --card: #2b261e; --border: #4a4438;
      --red: #d97a70; --teal: #8fc2af; --gold: #e3b662; --blue: #7fa8d9;
      --ok: #7cc795; --off: #6b6355;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: 'Lora', Georgia, serif; line-height: 1.5;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 36px 24px 48px; }
  .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }

  header { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
  header img { width: 64px; height: 64px; border-radius: 14px; }
  .eyebrow { font-family: 'JetBrains Mono', monospace; font-size: 0.7rem; letter-spacing: 0.12em;
             text-transform: uppercase; color: var(--muted); }
  h1 { margin: 2px 0 0; font-size: 2rem; font-weight: 700; }
  h1::after { content: ""; display: block; width: 3rem; height: 3px; background: var(--red); margin-top: 6px; }
  .summary { margin-left: auto; text-align: right; font-size: 0.9rem; color: var(--muted); }
  .summary b { color: var(--ink); }

  .profiles { display: flex; gap: 8px; flex-wrap: wrap; margin: 26px 0 6px; align-items: center; }
  .profiles span { font-size: 0.85rem; color: var(--muted); margin-right: 4px; }
  .chip { font-family: 'JetBrains Mono', monospace; font-size: 0.8rem; padding: 5px 12px; border-radius: 999px;
          border: 1px solid var(--border); background: var(--card); color: var(--ink); cursor: pointer; }
  .chip.active { background: var(--ink); color: var(--bg); border-color: var(--ink); }

  section { margin-top: 30px; }
  section > .eyebrow { margin-bottom: 10px; display: flex; align-items: center; gap: 10px; }
  section > .eyebrow::after { content: ""; flex: 1; height: 1px; background: var(--border); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; align-items: start; }

  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px;
          display: flex; flex-direction: column; gap: 8px; transition: opacity .2s, border-color .2s; }
  .card:hover { border-color: var(--muted); }
  .card.dim { opacity: 0.35; }
  .card h2 { margin: 0; font-size: 1.12rem; font-weight: 600; display: flex; align-items: center; gap: 10px; }
  .card h2 .acc { width: 4px; align-self: stretch; border-radius: 2px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--off); margin-left: auto; flex-shrink: 0; }
  .dot.ok { background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 25%, transparent); }
  .dot.na { background: transparent; border: 1px dashed var(--muted); }
  .card p { margin: 0; font-size: 0.9rem; color: var(--muted); flex-grow: 1; }
  .links { display: flex; flex-wrap: wrap; gap: 6px; }
  .links a, .links .static { font-family: 'JetBrains Mono', monospace; font-size: 0.78rem; text-decoration: none;
          color: var(--ink); border: 1px solid var(--border); border-radius: 6px; padding: 3px 8px; }
  .links a:hover { border-color: var(--ink); }
  .links a .lbl { color: var(--muted); margin-right: 6px; font-family: 'Lora', serif; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 0.78rem; color: var(--muted); }
  .meta code { font-family: 'JetBrains Mono', monospace; color: var(--ink); }
  .tags { display: flex; gap: 4px; }
  .tags i { font-style: normal; font-family: 'JetBrains Mono', monospace; font-size: 0.68rem; color: var(--muted);
            border: 1px solid var(--border); border-radius: 4px; padding: 0 5px; }

  .cmds { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 10px; }
  .cmd { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; }
  .cmd .what { font-size: 0.85rem; color: var(--muted); margin-bottom: 4px; }
  .cmd .line { display: flex; gap: 8px; align-items: flex-start; }
  .cmd code { flex: 1; font-family: 'JetBrains Mono', monospace; font-size: 0.78rem; white-space: pre-wrap; overflow-wrap: anywhere; }
  .copy { font-family: 'JetBrains Mono', monospace; font-size: 0.7rem; border: 1px solid var(--border); background: transparent;
          color: var(--muted); border-radius: 5px; padding: 2px 7px; cursor: pointer; }
  .copy:hover { color: var(--ink); border-color: var(--ink); }

  footer { margin-top: 40px; font-size: 0.8rem; color: var(--muted); border-top: 1px solid var(--border); padding-top: 14px;
           display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
</style>
</head>
<body>
<div class="wrap">

<header>
  <img src="favicon/web-app-manifest-192x192.png" alt="">
  <div>
    <div class="eyebrow">Środowisko Big Data na Dockerze</div>
    <h1>BigData26</h1>
  </div>
  <div class="summary">Odpowiada <b id="up-count">0</b> z <b id="http-count">0</b> interfejsów<br>
    <span class="mono" style="font-size:0.75rem;">sprawdzane co 10 s</span></div>
</header>

<div class="profiles">
  <span>Profil:</span>
  <button class="chip active" data-profile="all">all</button>
  <button class="chip" data-profile="kafka">kafka</button>
  <button class="chip" data-profile="spark">spark</button>
  <button class="chip" data-profile="flink">flink</button>
</div>

<main id="sections"></main>

<section>
  <div class="eyebrow">Polecenia (w katalogu ~/BigData26)</div>
  <div class="cmds" id="cmds"></div>
</section>

<footer>
  <span>Kontenery bez interfejsu WWW (Kafka, MySQL) oznaczone kropką przerywaną - ich stanu strona nie sprawdza.</span>
  <span class="mono">BigData26</span>
</footer>

</div>

<script>
// Usługi z docker-compose.yml: porty po stronie hosta, profile, dane logowania.
const groups = [
  { title: "Strumienie", items: [
    { name: "Kafka UI", color: "teal", profiles: ["kafka","spark","flink"],
      desc: "Klaster Kafki (KRaft, 3 brokery): tematy, wiadomości, grupy konsumentów.",
      links: [{ label: "UI", url: "http://localhost:8085" }] },
    { name: "Kafka - brokery", color: "teal", profiles: ["kafka","spark","flink"], http: false,
      desc: "Adresy dla klientów spoza Dockera (wymagają wpisów w /etc/hosts).",
      static: ["kafka-1:9092", "kafka-2:9093", "kafka-3:9094"] },
    { name: "ksqlDB", color: "gold", profiles: ["kafka"],
      desc: "SQL na strumieniach Kafki. Konsola w Kafka UI, serwer REST na porcie 8088.",
      links: [{ label: "konsola", url: "http://localhost:8085/ui/clusters/lab-cluster/ksqldb/tables" },
              { label: "REST", url: "http://localhost:8088/info", check: true }] },
  ]},
  { title: "Przetwarzanie", items: [
    { name: "Apache Flink", color: "red", profiles: ["flink"],
      desc: "Web UI JobManagera: zadania, TaskManagery i sloty, punkty kontrolne, watermarki.",
      links: [{ label: "Web UI", url: "http://localhost:8081" }] },
    { name: "Spark Master", color: "blue", profiles: ["spark"],
      desc: "Klaster Spark Standalone: workery, zasoby, uruchomione aplikacje.",
      links: [{ label: "UI", url: "http://localhost:8080" }],
      meta: [["master", "spark://localhost:7077"]] },
    { name: "Spark - aplikacje", color: "blue", profiles: ["spark"],
      desc: "Interfejsy działających aplikacji: Spark Connect oraz programy uruchomione w kontenerze spark-master.",
      links: [{ label: "Connect", url: "http://localhost:4040" }, { label: "master #1", url: "http://localhost:5050" },
              { label: "master #2", url: "http://localhost:5051" }],
      meta: [["Spark Connect", "sc://localhost:15002"]] },
    { name: "Spark History Server", color: "blue", profiles: ["spark"],
      desc: "Zakończone aplikacje: plany zapytań, etapy, zużycie zasobów (logi zdarzeń w MinIO).",
      links: [{ label: "UI", url: "http://localhost:18080" }] },
  ]},
  { title: "Notatniki", items: [
    { name: "JupyterLab", color: "gold", profiles: ["spark"],
      desc: "Notatniki PySpark połączone z klastrem Sparka; katalog notebooks/.",
      links: [{ label: "UI", url: "http://localhost:8888" }],
      meta: [["token", "password"]] },
  ]},
  { title: "Dane", items: [
    { name: "MinIO", color: "red", profiles: ["spark","flink"],
      desc: "Magazyn zgodny z S3: dane, punkty kontrolne Flinka i Sparka, logi Sparka.",
      links: [{ label: "konsola", url: "http://localhost:9001" }],
      meta: [["S3 API", "http://localhost:9000"], ["login", "admin / password"]] },
    { name: "MySQL", color: "teal", profiles: ["kafka","spark","flink"], http: false,
      desc: "Relacyjna baza - źródło i ujście danych przez JDBC (np. z DBeaver).",
      static: ["localhost:3306"],
      meta: [["baza", "lab_db"], ["login", "root / password"]] },
  ]},
];

const commands = [
  { what: "Uruchom środowisko do warsztatów z Flinka", cmd: "docker compose --profile flink up -d --scale flink-taskmanager=2" },
  { what: "Uruchom środowisko do warsztatów ze Sparka", cmd: "docker compose --profile spark up -d --scale spark-worker=2" },
  { what: "Uruchom środowisko do warsztatów z Kafki i ksqlDB", cmd: "docker compose --profile kafka up -d" },
  { what: "Sprawdź stan kontenerów", cmd: 'docker compose ps -a --format "{{.ID}} {{.Image}} {{.Names}} {{.Status}}"' },
  { what: "Zatrzymaj środowisko (dane zostają w wolumenach)", cmd: "docker compose --profile all down" },
  { what: "Zatrzymaj i usuń wszystkie dane (czysty start)", cmd: "docker compose --profile all down -v" },
];

const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const checks = [];
let httpCount = 0;

document.getElementById("sections").innerHTML = groups.map(g => `
  <section><div class="eyebrow">${g.title}</div><div class="grid">
  ${g.items.map((s, i) => {
    const id = (g.title + i).replace(/\W/g, "");
    const hasHttp = s.http !== false;
    if (hasHttp) { httpCount++; checks.push({ id, url: (s.links.find(l => l.check) || s.links[0]).url }); }
    const links = (s.links || []).map(l =>
      `<a href="${l.url}" target="_blank" rel="noopener"><span class="lbl">${l.label}</span>${esc(l.url.replace("http://", "").split("/")[0])}</a>`).join("")
      + (s.static || []).map(t => `<span class="static">${t}</span>`).join("");
    const meta = (s.meta || []).map(([k, v]) => `<span>${k}: <code>${esc(v)}</code></span>`).join("");
    return `<div class="card" id="${id}" data-profiles="${s.profiles.join(" ")}">
      <h2><span class="acc" style="background:var(--${s.color})"></span>${s.name}
        <span class="dot ${hasHttp ? "" : "na"}" title="${hasHttp ? "stan nieznany" : "brak interfejsu WWW"}"></span></h2>
      <p>${s.desc}</p>
      <div class="links">${links}</div>
      ${meta ? `<div class="meta">${meta}</div>` : ""}
      <div class="tags">${s.profiles.map(p => `<i>${p}</i>`).join("")}</div>
    </div>`; }).join("")}
  </div></section>`).join("");
document.getElementById("http-count").textContent = httpCount;

document.getElementById("cmds").innerHTML = commands.map((c, i) => `
  <div class="cmd"><div class="what">${c.what}</div>
  <div class="line"><code id="cmd${i}">${esc(c.cmd)}</code><button class="copy" data-cmd="${i}">kopiuj</button></div></div>`).join("");
document.querySelectorAll(".copy").forEach(b => b.addEventListener("click", () => {
  const t = commands[b.dataset.cmd].cmd;
  const done = () => { b.textContent = "skopiowano"; setTimeout(() => b.textContent = "kopiuj", 1500); };
  if (navigator.clipboard) navigator.clipboard.writeText(t).then(done, () => {});
  else { const r = document.createRange(); r.selectNode(document.getElementById("cmd" + b.dataset.cmd));
         getSelection().removeAllRanges(); getSelection().addRange(r); document.execCommand("copy"); done(); }
}));

document.querySelectorAll(".chip").forEach(ch => ch.addEventListener("click", () => {
  document.querySelectorAll(".chip").forEach(c => c.classList.toggle("active", c === ch));
  const p = ch.dataset.profile;
  document.querySelectorAll(".card").forEach(c =>
    c.classList.toggle("dim", p !== "all" && !c.dataset.profiles.split(" ").includes(p)));
}));

// Odpowiedź (nawet nieprzezroczysta, tryb no-cors) = usługa działa; błąd sieci albo przekroczenie czasu = nie działa.
async function check(s) {
  const dot = document.querySelector(`#${s.id} .dot`);
  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 2500);
  let ok = false;
  try { await fetch(s.url, { mode: "no-cors", cache: "no-store", signal: ctl.signal }); ok = true; } catch (e) {}
  clearTimeout(t);
  dot.classList.toggle("ok", ok); dot.title = ok ? "odpowiada" : "nie odpowiada";
  return ok;
}
async function refresh() {
  const res = await Promise.all(checks.map(check));
  document.getElementById("up-count").textContent = res.filter(Boolean).length;
}
refresh(); setInterval(refresh, 10000);
</script>
</body>
</html>
